<style>

<script>
// ==================== VERIFIED EDU PRICE TABLES ====================
// All EDU prices verified via apple.com.cn/cn-edu JSON-LD

// Air EDU: [size][chip][storage][memory]
const AIR_EDU = {
  '13-inch': {
    '10-8': {
      '512GB': { '16GB': 7699 },
    },
    '10-10': {
      '512GB': { '16GB': 8374, '24GB': 9199, '32GB': 10549 },
      '1TB':   { '16GB': 9199, '24GB': 10699, '32GB': 12049 },
      '2TB':   { '16GB': 11899, '24GB': 13399, '32GB': 14749 },
      '4TB':   { '16GB': 15949, '24GB': 17449, '32GB': 18799 },
    },
  },
  '15-inch': {
    '10-10': {
      '512GB': { '16GB': 9199, '24GB': 10699, '32GB': 12049 },
      '1TB':   { '16GB': 10699, '24GB': 12199, '32GB': 13549 },
      '2TB':   { '16GB': 13399, '24GB': 14899, '32GB': 16249 },
      '4TB':   { '16GB': 17449, '24GB': 18949, '32GB': 20299 },
    },
  },
};

// ==================== AIR REG ====================
// Base prices from bootstrap, upgrades: edu × multiplier
const MUL = 10/9; // reg ≈ edu × 1.111 for major upgrades

const AIR_REG = {
  '13-inch': {
    '10-8':  { '512GB': { '16GB': 8499 } },
    '10-10': {
      '512GB': { '16GB': 9249, '24GB': 10749, '32GB': 12249 },
      '1TB':   { '16GB': 10749, '24GB': 12249, '32GB': 13749 },
      '2TB':   { '16GB': 13449, '24GB': 14949, '32GB': 16449 },
      '4TB':   { '16GB': 17499, '24GB': 18999, '32GB': 20499 },
    },
  },
  '15-inch': {
    '10-10': {
      '512GB': { '16GB': 9999,  '24GB': 11499, '32GB': 12999 },
      '1TB':   { '16GB': 11499, '24GB': 12999, '32GB': 14499 },
      '2TB':   { '16GB': 14199, '24GB': 15699, '32GB': 17199 },
      '4TB':   { '16GB': 18249, '24GB': 19749, '32GB': 21249 },
    },
  },
};

// ==================== PRO EDU ====================
// Base EDU prices for all Pro chips (14-inch standard display base configs)
const PRO_EDU_BASE = {
  'M5-10-10':    12699,  // 16GB/1TB
  'M5Pro-15-16': 19499,  // 24GB/2TB
  'M5Pro-18-20': 21399,  // 24GB/2TB
  'M5Max-18-32': 27499,  // 36GB/2TB
  'M5Max-18-40': 30874,  // 48GB/2TB
};

// Base memory per chip
const PRO_BASE_MEM = {
  'M5-10-10':    '16GB',
  'M5Pro-15-16': '24GB',
  'M5Pro-18-20': '24GB',
  'M5Max-18-32': '36GB',
  'M5Max-18-40': '48GB',
};

// Base storage per chip
const PRO_BASE_STOR = {
  'M5-10-10':    '1TB',
  'M5Pro-15-16': '2TB',
  'M5Pro-18-20': '2TB',
  'M5Max-18-32': '2TB',
  'M5Max-18-40': '2TB',
};

// ==================== PRO REG ====================
const PRO_REG_BASE = {
  'M5-10-10':    13499,
  'M5Pro-15-16': 17999,
  'M5Pro-18-20': 19999,
  'M5Max-18-32': 29999,
  'M5Max-18-40': 33749,
};

// ==================== UPGRADE PRICES (EDU, verified from JSON-LD) ====================

// Memory upgrade steps: { chip: [ {from, to, edu} ] }
const MEM_EDU_STEPS = {
  'M5-10-10':    [{f:'16GB',t:'24GB',e:1500},{f:'24GB',t:'32GB',e:1500}],
  'M5Pro-15-16': [{f:'24GB',t:'48GB',e:2700}],
  'M5Pro-18-20': [{f:'24GB',t:'48GB',e:2700},{f:'48GB',t:'64GB',e:1350}],
  'M5Max-18-32': [{f:'36GB',t:'64GB',e:3000},{f:'64GB',t:'128GB',e:6000}],
  'M5Max-18-40': [{f:'48GB',t:'64GB',e:1350},{f:'64GB',t:'128GB',e:5400}],
};

// Storage upgrade steps: { type: [ {from, to, edu} ] }
const STOR_EDU_STEPS = {
  'Air': [{f:'512GB',t:'1TB',e:1500},{f:'1TB',t:'2TB',e:2700},{f:'2TB',t:'4TB',e:4050}],
  'Pro': [{f:'1TB',t:'2TB',e:2700},{f:'2TB',t:'4TB',e:4050},{f:'4TB',t:'8TB',e:8100}],
};

// Other upgrades (both reg and edu)
const DISPLAY_UPGRADE = { reg: 1125, edu: 1013 };

const SIZE_UPGRADE_EDU = { 'M5Pro-18-20': 1700, 'M5Max-18-32': 2000, 'M5Max-18-40': 2625 };
const SIZE_UPGRADE_REG = { 'M5Pro-18-20': 2000, 'M5Max-18-32': 2000, 'M5Max-18-40': 2250 };

const AIR_SIZE_EDU = 1500;  // Full price
const AIR_SIZE_REG = 1500;

// Power adapter: flat rate regardless of reg/edu
const POWER_COST = {
  'air-35w': { reg: 120, edu: 120 },
  'air-70w': { reg: 120, edu: 120 },
  'pro-96w': { reg: 135, edu: 135 },
};

// First-upgrade discount on Air (applied to first mem or stor upgrade from base 16/512)
const AIR_FIRST_DISCOUNT_EDU = 675; // 1500 -> 825
const AIR_FIRST_DISCOUNT_REG = 750;  // ~1500*0.5

// ==================== OPTIONS ====================
const AIR_SIZE_OPTS = [
  { value: '13-inch', label: '13 英寸' },
  { value: '15-inch', label: '15 英寸' },
];
const AIR_CHIP_OPTS = [
  { value: '10-8',  label: 'M5 (8核GPU)' },
  { value: '10-10', label: 'M5 (10核GPU)' },
];
const AIR_MEM_OPTS = ['16GB','24GB','32GB'];
const AIR_STOR_OPTS = ['512GB','1TB','2TB','4TB'];
const AIR_POWER_OPTS = [
  { value: '40W', label: '40W 动态（默认）' },
  { value: '35W', label: '35W 双USB-C (+¥120)' },
  { value: '70W', label: '70W USB-C (+¥120)' },
];

const PRO_SIZE_OPTS = [
  { value: '14-inch', label: '14 英寸' },
  { value: '16-inch', label: '16 英寸' },
];
const PRO_DISPLAY_OPTS = [
  { value: 'Standard',     label: '标准显示屏' },
  { value: 'Nano-texture', label: '纳米纹理显示屏' },
];
const PRO_CHIP_OPTS = [
  { value: 'M5-10-10',    label: 'M5 (10CPU/10GPU)',         sizes: ['14-inch'] },
  { value: 'M5Pro-15-16', label: 'M5 Pro (15CPU/16GPU)',     sizes: ['14-inch'] },
  { value: 'M5Pro-18-20', label: 'M5 Pro (18CPU/20GPU)',     sizes: ['14-inch','16-inch'] },
  { value: 'M5Max-18-32', label: 'M5 Max (18CPU/32GPU)',     sizes: ['14-inch','16-inch'] },
  { value: 'M5Max-18-40', label: 'M5 Max (18CPU/40GPU)',     sizes: ['14-inch','16-inch'] },
];
const PRO_MEM_OPTS_BY_CHIP = {
  'M5-10-10':    ['16GB','24GB','32GB'],
  'M5Pro-15-16': ['24GB','48GB'],
  'M5Pro-18-20': ['24GB','48GB','64GB'],
  'M5Max-18-32': ['36GB','64GB','128GB'],
  'M5Max-18-40': ['48GB','64GB','128GB'],
};
const PRO_STOR_OPTS_BY_CHIP = {
  'M5-10-10':    ['1TB','2TB','4TB'],
  'M5Pro-15-16': ['2TB','4TB','8TB'],
  'M5Pro-18-20': ['2TB','4TB','8TB'],
  'M5Max-18-32': ['2TB','4TB','8TB'],
  'M5Max-18-40': ['2TB','4TB','8TB'],
};
const PRO_POWER_OPTS = {
  '14-inch': {
    'M5-10-10':    ['70W','96W'],
    'M5Pro-15-16': ['70W','96W'],
    'M5Pro-18-20': ['70W','96W'],
    'M5Max-18-32': ['96W'],
    'M5Max-18-40': ['96W'],
  },
  '16-inch': {
    'M5Pro-18-20': ['140W'],
    'M5Max-18-32': ['140W'],
    'M5Max-18-40': ['140W'],
  },
};

// ==================== STATE ====================
let airState = { size:'13-inch', chip:'10-10', memory:'16GB', storage:'512GB', power:'40W' };
let proState = { size:'14-inch', display:'Standard', chip:'M5Pro-18-20', memory:'24GB', storage:'2TB', power:'70W' };

// ==================== HELPERS ====================
function fmt(n) { return '¥' + n.toLocaleString('zh-CN'); }
function monthly(n) { return '或 ¥' + Math.round(n/24).toLocaleString('zh-CN') + '/月 (24期 0%费率)'; }
function subsidy(p) { return p < 10000 ? Math.round(p * 0.85) : p - 1500; }

function sumSteps(steps, from, to, store) {
  if (from === to) return 0;
  let cost = 0, cur = from;
  while (cur !== to) {
    const s = steps.find(u => u.f === cur);
    if (!s) return 0;
    cost += store === 'reg' ? (s.r || Math.round(s.e * MUL)) : s.e;
    cur = s.t;
  }
  return cost;
}

// ==================== RENDER ====================
function renderBtns(containerId, opts, stateKey, stateObj, onChange, cssClass, availFn) {
  const el = document.getElementById(containerId);
  let html = '';
  for (const o of opts) {
    const val = typeof o === 'string' ? o : o.value;
    const label = typeof o === 'string' ? o : o.label;
    const sel = val === stateObj[stateKey] ? ' selected' + (cssClass||'') : '';
    let dis = '';
    if (availFn && !availFn(val, stateObj)) dis = ' disabled';
    html += `<button class="option-btn${sel}"${dis} data-value="${val}">${label}</button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      stateObj[stateKey] = btn.dataset.value;
      onChange();
    });
  });
}

// ==================== AIR ====================
function renderAir() {
  renderBtns('air-size-btns', AIR_SIZE_OPTS, 'size', airState, airChanged);
  renderBtns('air-chip-btns', AIR_CHIP_OPTS, 'chip', airState, airChanged, '', (v,st) => {
    if (v === '10-8') return st.size === '13-inch' && st.memory === '16GB' && st.storage === '512GB';
    return true;
  });
  renderBtns('air-memory-btns', AIR_MEM_OPTS, 'memory', airState, airChanged, '', (v,st) => {
    if (st.chip === '10-8') return v === '16GB';
    return true;
  });
  renderBtns('air-storage-btns', AIR_STOR_OPTS, 'storage', airState, airChanged, '', (v,st) => {
    if (st.chip === '10-8') return v === '512GB';
    return true;
  });
  renderBtns('air-power-btns', AIR_POWER_OPTS, 'power', airState, airChanged);
}

function airChanged() {
  if (airState.chip === '10-8' && (airState.size !== '13-inch' || airState.memory !== '16GB' || airState.storage !== '512GB')) {
    airState.chip = '10-10';
  }
  if (airState.size === '15-inch' && airState.chip === '10-8') airState.chip = '10-10';
  renderAir();
  calcAir();
}

function getAirEdu() {
  const { size, chip, memory, storage } = airState;
  // Check lookup table first
  const tableEntry = AIR_EDU[size]?.[chip]?.[storage]?.[memory];
  if (tableEntry !== undefined) return tableEntry;

  // Fallback: compute from 13" base
  const base = AIR_EDU['13-inch']['10-10']['512GB']['16GB']; // 8374
  let price = base;
  let firstDiscount = AIR_FIRST_DISCOUNT_EDU;
  let usedFirst = false;

  if (size === '15-inch') {
    price += AIR_SIZE_EDU - (usedFirst ? 0 : firstDiscount);
    usedFirst = true;
  }
  // Memory from 16GB
  let curMem = '16GB';
  while (curMem !== memory) {
    const step = curMem === '16GB' ? {f:'16GB',t:'24GB',e:1500} : {f:'24GB',t:'32GB',e:1350};
    if (step.f !== curMem) break;
    price += step.e - (!usedFirst ? firstDiscount : 0);
    usedFirst = true;
    curMem = step.t;
  }
  // Storage from 512GB
  let curStor = '512GB';
  const storSteps = [{f:'512GB',t:'1TB',e:1500},{f:'1TB',t:'2TB',e:2700},{f:'2TB',t:'4TB',e:4050}];
  while (curStor !== storage) {
    const step = storSteps.find(s => s.f === curStor);
    if (!step) break;
    price += step.e - (!usedFirst ? firstDiscount : 0);
    usedFirst = true;
    curStor = step.t;
  }
  return price;
}

function getAirReg() {
  const { size, chip, memory, storage } = airState;
  const tableEntry = AIR_REG[size]?.[chip]?.[storage]?.[memory];
  if (tableEntry !== undefined) return tableEntry;

  // Fallback
  const base = AIR_REG['13-inch']['10-10']['512GB']['16GB']; // 9249
  let price = base;
  let firstDiscount = AIR_FIRST_DISCOUNT_REG;
  let usedFirst = false;

  if (size === '15-inch') {
    price += AIR_SIZE_REG - (usedFirst ? 0 : firstDiscount);
    usedFirst = true;
  }
  let curMem = '16GB';
  while (curMem !== memory) {
    const step = curMem === '16GB' ? {f:'16GB',t:'24GB',r:1500} : {f:'24GB',t:'32GB',r:1500};
    if (step.f !== curMem) break;
    price += step.r - (!usedFirst ? firstDiscount : 0);
    usedFirst = true;
    curMem = step.t;
  }
  let curStor = '512GB';
  const storSteps = [{f:'512GB',t:'1TB',r:1500},{f:'1TB',t:'2TB',r:3000},{f:'2TB',t:'4TB',r:4500}];
  while (curStor !== storage) {
    const step = storSteps.find(s => s.f === curStor);
    if (!step) break;
    price += step.r - (!usedFirst ? firstDiscount : 0);
    usedFirst = true;
    curStor = step.t;
  }
  return price;
}

function calcAir() {
  const powerCost = airState.power === '40W' ? 0 : (airState.power === '35W' ? POWER_COST['air-35w'] : POWER_COST['air-70w']);

  const tEdu = getAirEdu() + powerCost.edu;
  const tReg = getAirReg() + powerCost.reg;
  const tSub = subsidy(tEdu);

  document.getElementById('air-price-reg').textContent = fmt(tReg);
  document.getElementById('air-price-edu').textContent = fmt(tEdu);
  document.getElementById('air-price-subsidy').textContent = fmt(tSub);
  document.getElementById('air-monthly-reg').textContent = monthly(tReg);
  document.getElementById('air-monthly-edu').textContent = monthly(tEdu);
  document.getElementById('air-monthly-subsidy').textContent = monthly(tSub);

  const diff = tReg - tEdu;
  const dEl = document.getElementById('air-price-diff');
  dEl.innerHTML = `教育优惠节省 <strong>${fmt(diff)}</strong>（约 ${Math.round(diff/tReg*100)}%）· 国补再省 <strong>${fmt(tEdu - tSub)}</strong>`;
  dEl.className = 'price-diff cheaper';

  const bd = document.getElementById('air-breakdown');
  const se = getAirEdu(), sr = getAirReg();
  let h = '<table>';
  h += `<tr><td>基础配置 (${airState.size} ${airState.chip==='10-8'?'M5 8核GPU':'M5 10核GPU'} ${airState.memory}/${airState.storage})</td><td>${fmt(sr)}</td><td>${fmt(se)}</td><td></td></tr>`;
  if (powerCost.reg) h += `<tr><td>电源适配器 ${airState.power}</td><td>+${fmt(powerCost.reg)}</td><td>+${fmt(powerCost.edu)}</td><td></td></tr>`;
  h += `<tr class="total"><td>总计</td><td>${fmt(tReg)}</td><td>${fmt(tEdu)}</td><td>${fmt(tSub)}</td></tr>`;
  h += '</table>';
  bd.innerHTML = h;
}

// ==================== PRO ====================
function renderPro() {
  renderBtns('pro-size-btns', PRO_SIZE_OPTS, 'size', proState, proChanged, ' pro');
  renderBtns('pro-display-btns', PRO_DISPLAY_OPTS, 'display', proState, proChanged, ' pro');
  renderBtns('pro-chip-btns', PRO_CHIP_OPTS, 'chip', proState, proChanged, ' pro', (v,st) => {
    const opt = PRO_CHIP_OPTS.find(o => o.value === v);
    return opt && opt.sizes.includes(st.size);
  });
  renderBtns('pro-memory-btns', (PRO_MEM_OPTS_BY_CHIP[proState.chip]||[]).map(v=>({value:v,label:v})), 'memory', proState, proChanged, ' pro');
  renderBtns('pro-storage-btns', (PRO_STOR_OPTS_BY_CHIP[proState.chip]||[]).map(v=>({value:v,label:v})), 'storage', proState, proChanged, ' pro');
  renderBtns('pro-power-btns', (PRO_POWER_OPTS[proState.size]?.[proState.chip]||[]).map(v=>({value:v,label:v+' USB-C'+(v==='96W'&&proState.size==='14-inch'&&!proState.chip.startsWith('M5Max')?' (+¥135)':'')})), 'power', proState, proChanged, ' pro');
}

function proChanged() {
  const validChips = PRO_CHIP_OPTS.filter(o => o.sizes.includes(proState.size)).map(o => o.value);
  if (!validChips.includes(proState.chip)) proState.chip = validChips[0];

  // Memory/chip constraints
  if (proState.chip === 'M5Max-18-32' && proState.memory === '48GB') proState.chip = 'M5Max-18-40';
  if (proState.chip === 'M5Max-18-40' && proState.memory === '36GB') proState.chip = 'M5Max-18-32';

  const validMems = PRO_MEM_OPTS_BY_CHIP[proState.chip] || [];
  if (!validMems.includes(proState.memory)) proState.memory = validMems[0];

  const validStors = PRO_STOR_OPTS_BY_CHIP[proState.chip] || [];
  if (!validStors.includes(proState.storage)) proState.storage = validStors[0];

  const validPower = PRO_POWER_OPTS[proState.size]?.[proState.chip] || [];
  if (!validPower.includes(proState.power)) proState.power = validPower[0];

  renderPro();
  calcPro();
}

function calcPro() {
  const { size, display, chip, memory, storage, power } = proState;
  const baseEdu = PRO_EDU_BASE[chip];
  const baseReg = PRO_REG_BASE[chip];
  const baseMem = PRO_BASE_MEM[chip];
  const baseStor = PRO_BASE_STOR[chip];

  let edu = baseEdu, reg = baseReg;
  const items = [];

  // Display upgrade
  if (display === 'Nano-texture') {
    edu += DISPLAY_UPGRADE.edu; reg += DISPLAY_UPGRADE.reg;
    items.push({ label: '纳米纹理显示屏', r: DISPLAY_UPGRADE.reg, e: DISPLAY_UPGRADE.edu });
  }

  // Size upgrade
  if (size === '16-inch') {
    const sr = SIZE_UPGRADE_REG[chip] || 2000;
    const se = SIZE_UPGRADE_EDU[chip] || 2000;
    edu += se; reg += sr;
    items.push({ label: '升级至 16 英寸', r: sr, e: se });
  }

  // Memory
  const mReg = sumSteps(MEM_EDU_STEPS[chip].map(s=>({...s,r:Math.round(s.e*MUL)})), baseMem, memory, 'reg');
  const mEdu = sumSteps(MEM_EDU_STEPS[chip], baseMem, memory, 'edu');
  if (mReg || mEdu) items.push({ label: `内存 ${baseMem} → ${memory}`, r: mReg, e: mEdu });

  // Storage
  const sReg = sumSteps(STOR_EDU_STEPS['Pro'].map(s=>({...s,r:Math.round(s.e*MUL)})), baseStor, storage, 'reg');
  const sEdu = sumSteps(STOR_EDU_STEPS['Pro'], baseStor, storage, 'edu');
  if (sReg || sEdu) items.push({ label: `硬盘 ${baseStor} → ${storage}`, r: sReg, e: sEdu });

  // Power
  let pReg = 0, pEdu = 0;
  if (size === '14-inch') {
    if (power === '96W' && !chip.startsWith('M5Max')) {
      pReg = POWER_COST['pro-96w'].reg; pEdu = POWER_COST['pro-96w'].edu;
      items.push({ label: '电源 70W → 96W', r: pReg, e: pEdu });
    }
  }

  const tReg = reg + mReg + sReg + pReg;
  const tEdu = edu + mEdu + sEdu + pEdu;
  const tSub = subsidy(tEdu);

  document.getElementById('pro-price-reg').textContent = fmt(tReg);
  document.getElementById('pro-price-edu').textContent = fmt(tEdu);
  document.getElementById('pro-price-subsidy').textContent = fmt(tSub);
  document.getElementById('pro-monthly-reg').textContent = monthly(tReg);
  document.getElementById('pro-monthly-edu').textContent = monthly(tEdu);
  document.getElementById('pro-monthly-subsidy').textContent = monthly(tSub);

  const diff = tReg - tEdu;
  const dEl = document.getElementById('pro-price-diff');
  dEl.innerHTML = `教育优惠节省 <strong>${fmt(diff)}</strong>（约 ${Math.round(diff/tReg*100)}%）· 国补再省 <strong>${fmt(tEdu - tSub)}</strong>`;
  dEl.className = 'price-diff cheaper';

  const bd = document.getElementById('pro-breakdown');
  let h = '<table>';
  h += `<tr><td>基础配置 (14"标准 ${chip.replace(/-/g,' ')} ${baseMem}/${baseStor})</td><td>${fmt(baseReg)}</td><td>${fmt(baseEdu)}</td><td></td></tr>`;
  for (const it of items) {
    h += `<tr><td>${it.label}</td><td>+${fmt(it.r)}</td><td>+${fmt(it.e)}</td><td></td></tr>`;
  }
  h += `<tr class="total"><td>总计</td><td>${fmt(tReg)}</td><td>${fmt(tEdu)}</td><td>${fmt(tSub)}</td></tr>`;
  h += '</table>';
  bd.innerHTML = h;
}

// ==================== INIT ====================
renderAir(); calcAir();
renderPro(); calcPro();
</script>
</body>
</html>
