.price-monthly { font-size: 13px; color: #86868b; margin-top: 6px; }
.price-diff { font-size: 15px; font-weight: 500; margin-top: 12px; text-align: center; }

.breakdown { margin-top: 16px; font-size: 13px; color: #86868b; background: #fbfbfd; border-radius: 10px; padding: 12px 16px; }

.note { font-size: 12px; color: #86868b; margin-top: 24px; text-align: center; line-height: 1.6; }

// ==================== AIR OPTION DEFINITIONS ====================

const AIR_SIZE_OPTS = [

];

  { value: '35W', label: '35W 双USB-C' },
  { value: '70W', label: '70W USB-C' },
];

// ==================== PRO OPTION DEFINITIONS ====================

const PRO_SIZE_OPTS = [
  { value: '14-inch', label: '14 英寸' },
  { value: '16-inch', label: '16 英寸' },
];

const PRO_DISPLAY_OPTS = [
  { value: 'Standard',     label: '标准显示屏' },
  { value: 'Nano-texture', label: '纳米纹理显示屏' },
];

const PRO_CHIP_OPTS = [

const PRO_MEMORY_OPTS = [

  { value: '24GB',  label: '24GB',  chips: ['M5-10-10','M5Pro-15-16','M5Pro-18-20'] },

];

const PRO_POWER_OPTS = [
  { value: '70W',  label: '70W USB-C',  sizes: ['14-inch'], chips: ['M5-10-10','M5Pro-15-16','M5Pro-18-20'] },

];

// ==================== STATE ====================

let airState = { size: '13-inch', chip: '10-10', memory: '16GB', storage: '512GB', power: '40W' };
let proState = { size: '14-inch', display: 'Standard', chip: 'M5Pro-18-20', memory: '24GB', storage: '2TB', power: '70W' };

// ==================== HELPERS ====================

function fmt(n) { return '¥' + n.toLocaleString('zh-CN'); }
function monthly(n) { return '或 ¥' + Math.round(n/24).toLocaleString('zh-CN') + '/月 (24期 0%费率)'; }
function subsidy(eduPrice) { return eduPrice < 10000 ? Math.round(eduPrice * 0.85) : eduPrice - 1500; }

function getMemCost(chipKey, from, to, store) {
  if (from === to) return 0;
  const d = MEMORY_UPGRADE[chipKey]; if (!d) return 0;
  let cost = 0, cur = from;
  while (cur !== to) {
    const s = d.upgrade.find(u => u.from === cur);
    if (!s) return 0;
    cost += store === 'reg' ? s.reg : s.edu;
    cur = s.to;
  }
  return cost;
}

function getStorCost(type, from, to, store) {
  if (from === to) return 0;
  const d = STORAGE_UPGRADE[type]; if (!d) return 0;
  let cost = 0, cur = from;
  while (cur !== to) {
    const s = d.upgrade.find(u => u.from === cur);
    if (!s) return 0;
    cost += store === 'reg' ? s.reg : s.edu;
    cur = s.to;
  }
  return cost;
}

function getPowerCost(type, from, to, store) {
  if (from === to) return 0;
  const d = POWER_UPGRADE[type]; if (!d) return 0;
  const step = d.upgrade.find(u => u.from === from && u.to === to);
  if (step) return store === 'reg' ? step.reg : step.edu;
  return 0;
}

function getSizeUp(chip, from, to, store) {
  if (from === to) return 0;
  const d = SIZE_UPGRADE[chip]; if (!d) return 0;
  return store === 'reg' ? d.reg : d.edu;
}

// ==================== RENDER BUTTONS ====================

function renderBtns(containerId, opts, stateKey, stateObj, onClick, cssClass, checkAvail) {
  const el = document.getElementById(containerId);
  let html = '';
  for (const o of opts) {
    const sel = o.value === stateObj[stateKey] ? ' selected' + (cssClass||'') : '';
    let dis = '';
    if (checkAvail && !checkAvail(o, stateObj)) dis = ' disabled';
    html += `<button class="option-btn${sel}"${dis} data-value="${o.value}">${o.label}</button>`;
  }
  el.innerHTML = html;

  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.disabled) return;
      stateObj[stateKey] = btn.dataset.value;
      onClick();
    });
  });
}

// ==================== AIR ====================

function renderAir() {
  renderBtns('air-size-btns', AIR_SIZE_OPTS, 'size', airState, airChanged, '');
  renderBtns('air-chip-btns', AIR_CHIP_OPTS, 'chip', airState, airChanged, '', (o,st) => o.avail.includes(st.size));
  renderBtns('air-memory-btns', AIR_MEMORY_OPTS, 'memory', airState, airChanged, '', (o,st) => o.chips.includes(st.chip));
  renderBtns('air-storage-btns', AIR_STORAGE_OPTS, 'storage', airState, airChanged, '', (o,st) => o.chips.includes(st.chip));
  renderBtns('air-power-btns', AIR_POWER_OPTS, 'power', airState, airChanged);
}

function airChanged() {
  // Validate constraints on size change
  const validChips = AIR_CHIP_OPTS.filter(o => o.avail.includes(airState.size)).map(o => o.value);
  if (!validChips.includes(airState.chip)) airState.chip = '10-10';

  const validMems = AIR_MEMORY_OPTS.filter(o => o.chips.includes(airState.chip)).map(o => o.value);
  if (!validMems.includes(airState.memory)) airState.memory = validMems[0];

  const validStors = AIR_STORAGE_OPTS.filter(o => o.chips.includes(airState.chip)).map(o => o.value);
  if (!validStors.includes(airState.storage)) airState.storage = validStors[0];

  renderAir();
  calcAir();
}

function calcAir() {
  const { size, chip, memory, storage, power } = airState;
  const base = AIR_BASE[size][chip];
  if (!base) return;

  const mReg = getMemCost('M5', base.mem, memory, 'reg');
  const mEdu = getMemCost('M5', base.mem, memory, 'edu');
  const sReg = getStorCost('Air', base.storage, storage, 'reg');
  const sEdu = getStorCost('Air', base.storage, storage, 'edu');
  const pReg = getPowerCost('Air', base.power, power, 'reg');
  const pEdu = getPowerCost('Air', base.power, power, 'edu');

  const tReg = base.reg + mReg + sReg + pReg;
  const tEdu = base.edu + mEdu + sEdu + pEdu;
  const tSubsidy = subsidy(tEdu);

  document.getElementById('air-price-reg').textContent = fmt(tReg);
  document.getElementById('air-price-edu').textContent = fmt(tEdu);
  document.getElementById('air-price-subsidy').textContent = fmt(tSubsidy);
  document.getElementById('air-monthly-reg').textContent = monthly(tReg);
  document.getElementById('air-monthly-edu').textContent = monthly(tEdu);
  document.getElementById('air-monthly-subsidy').textContent = monthly(tSubsidy);

  const diff = tReg - tEdu;
  const dEl = document.getElementById('air-price-diff');
  dEl.innerHTML = `教育优惠节省 <strong>${fmt(diff)}</strong>（约 ${Math.round(diff/tReg*100)}%）· 国补再省 <strong>${fmt(tEdu - tSubsidy)}</strong>`;
  dEl.className = 'price-diff cheaper';

  const bd = document.getElementById('air-breakdown');
  let h = '<table>';
  h += `<tr><td>基础价格 (${size} · ${airState.chip === '10-8' ? 'M5 8核GPU' : 'M5 10核GPU'})</td><td>${fmt(base.reg)}</td><td>${fmt(base.edu)}</td><td></td></tr>`;
  if (mReg) h += `<tr><td>内存 ${base.mem} → ${memory}</td><td>+${fmt(mReg)}</td><td>+${fmt(mEdu)}</td><td></td></tr>`;
  if (sReg) h += `<tr><td>硬盘 ${base.storage} → ${storage}</td><td>+${fmt(sReg)}</td><td>+${fmt(sEdu)}</td><td></td></tr>`;
  if (pReg) h += `<tr><td>电源 ${base.power} → ${power}</td><td>+${fmt(pReg)}</td><td>+${fmt(pEdu)}</td><td></td></tr>`;
  h += `<tr class="total"><td>总计</td><td>${fmt(tReg)}</td><td>${fmt(tEdu)}</td><td>${fmt(tSubsidy)}</td></tr>`;
  h += '</table>';
  bd.innerHTML = h;
}

// ==================== PRO ====================

function renderPro() {
  renderBtns('pro-size-btns', PRO_SIZE_OPTS, 'size', proState, proChanged, ' pro');
  renderBtns('pro-display-btns', PRO_DISPLAY_OPTS, 'display', proState, proChanged, ' pro');
  renderBtns('pro-chip-btns', PRO_CHIP_OPTS, 'chip', proState, proChanged, ' pro', (o,st) => o.sizes.includes(st.size));
  renderBtns('pro-memory-btns', PRO_MEMORY_OPTS, 'memory', proState, proChanged, ' pro', (o,st) => o.chips.includes(st.chip));
  renderBtns('pro-storage-btns', PRO_STORAGE_OPTS, 'storage', proState, proChanged, ' pro', (o,st) => o.chips.includes(st.chip));
  renderBtns('pro-power-btns', PRO_POWER_OPTS, 'power', proState, proChanged, ' pro', (o,st) => {
    if (o.sizes && !o.sizes.includes(st.size)) return false;
    if (o.chips && !o.chips.includes(st.chip)) return false;
    return true;
  });
}

function proChanged() {
  const validChips = PRO_CHIP_OPTS.filter(o => o.sizes.includes(proState.size)).map(o => o.value);
  if (!validChips.includes(proState.chip)) proState.chip = validChips[0];

  const validMems = PRO_MEMORY_OPTS.filter(o => o.chips.includes(proState.chip)).map(o => o.value);
  if (!validMems.includes(proState.memory)) proState.memory = validMems[0];

  const validStors = PRO_STORAGE_OPTS.filter(o => o.chips.includes(proState.chip)).map(o => o.value);
  if (!validStors.includes(proState.storage)) proState.storage = validStors[0];

  const validPower = PRO_POWER_OPTS.filter(o => {
    if (o.sizes && !o.sizes.includes(proState.size)) return false;
    if (o.chips && !o.chips.includes(proState.chip)) return false;
    return true;
  }).map(o => o.value);
  if (!validPower.includes(proState.power)) proState.power = validPower[0];

  renderPro();
  calcPro();
}

function calcPro() {
  const { size, display, chip, memory, storage, power } = proState;

  // Start from 14" Standard
  const base14std = PRO_BASE['14-inch']['Standard'][chip];
  if (!base14std) return;

  let startReg = base14std.reg;
  let startEdu = base14std.edu;
  const items = [];

  // Display
  if (display === 'Nano-texture') {
    const dr = DISPLAY_UPGRADE.reg;
    const de = DISPLAY_UPGRADE.edu;
    startReg += dr; startEdu += de;
    items.push({ label: '纳米纹理显示屏', reg: dr, edu: de });
  }

  // Size - but check storage difference
  // 14" M5Pro-18-20 has 2TB base, but 16" M5Pro-18-20 has 1TB base
  // The SIZE_UPGRADE cost accounts for the size difference only
  // Storage is calculated separately from the 14" standard base

  if (size === '16-inch') {
    const sr = getSizeUp(chip, '14-inch', '16-inch', 'reg');
    const se = getSizeUp(chip, '14-inch', '16-inch', 'edu');
    startReg += sr; startEdu += se;
    items.push({ label: '升级至 16 英寸', reg: sr, edu: se });

    // If 16-inch base has different storage than 14-inch base for this chip,
    // we need to adjust. 16" M5Pro-18-20 base is 1TB, 14" is 2TB.
    // The size upgrade price includes this storage difference already.
    // We'll use the 14" standard base for storage calculation.
  }

  // Memory
  const mReg = getMemCost(chip, base14std.mem, memory, 'reg');
  const mEdu = getMemCost(chip, base14std.mem, memory, 'edu');
  if (mReg) items.push({ label: `内存 ${base14std.mem} → ${memory}`, reg: mReg, edu: mEdu });

  // Storage
  const sReg = getStorCost('Pro', base14std.storage, storage, 'reg');
  const sEdu = getStorCost('Pro', base14std.storage, storage, 'edu');
  if (sReg) items.push({ label: `硬盘 ${base14std.storage} → ${storage}`, reg: sReg, edu: sEdu });

  // Power - for 14" models, power upgrade is optional
  // For 14-inch with Max chips, base power is 96W (only option)
  // For 16-inch, power is always 140W
  let powerType, basePower;
  if (size === '16-inch') {
    powerType = 'Pro-16'; basePower = '140W';
  } else {
    powerType = 'Pro-14'; basePower = chip.startsWith('M5Max') ? '96W' : '70W';
  }
  const pReg = getPowerCost(powerType, basePower, power, 'reg');
  const pEdu = getPowerCost(powerType, basePower, power, 'edu');
  if (pReg) items.push({ label: `电源适配器 ${basePower} → ${power}`, reg: pReg, edu: pEdu });

  const tReg = startReg + mReg + sReg + pReg;
  const tEdu = startEdu + mEdu + sEdu + pEdu;
  const tSubsidy = subsidy(tEdu);

  document.getElementById('pro-price-reg').textContent = fmt(tReg);
  document.getElementById('pro-price-edu').textContent = fmt(tEdu);
  document.getElementById('pro-price-subsidy').textContent = fmt(tSubsidy);
  document.getElementById('pro-monthly-reg').textContent = monthly(tReg);
  document.getElementById('pro-monthly-edu').textContent = monthly(tEdu);
  document.getElementById('pro-monthly-subsidy').textContent = monthly(tSubsidy);

  const diff = tReg - tEdu;
  const dEl = document.getElementById('pro-price-diff');
  dEl.innerHTML = `教育优惠节省 <strong>${fmt(diff)}</strong>（约 ${Math.round(diff/tReg*100)}%）· 国补再省 <strong>${fmt(tEdu - tSubsidy)}</strong>`;
  dEl.className = 'price-diff cheaper';

  const bd = document.getElementById('pro-breakdown');
  let h = '<table>';
  h += `<tr><td>基础价格 (14" 标准 ${chip.replace(/-/g,' ')})</td><td>${fmt(base14std.reg)}</td><td>${fmt(base14std.edu)}</td><td></td></tr>`;
  for (const it of items) {
    h += `<tr><td>${it.label}</td><td>+${fmt(it.reg)}</td><td>+${fmt(it.edu)}</td><td></td></tr>`;
  }
  h += `<tr class="total"><td>总计</td><td>${fmt(tReg)}</td><td>${fmt(tEdu)}</td><td>${fmt(tSubsidy)}</td></tr>`;
  h += '</table>';
  bd.innerHTML = h;
}

// ==================== INIT ====================
renderAir();
calcAir();
renderPro();
calcPro();
</script>
